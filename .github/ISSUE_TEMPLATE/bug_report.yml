name: Bug Report
description: Report a bug or unexpected behavior in Clipper
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Launch Clipper
        2. Copy ...
        3. Hover top-center of screen
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version & Display Setup
      description: e.g. Windows 11 23H2, dual monitors (1920x1080 @ 100%, 2560x1440 @ 125%)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clipper Version
      placeholder: "0.1.0"
